# 文档编辑器 - Nginx生产环境配置
# 此配置实现：
# 1. 同源部署（消除跨域开销）
# 2. 静态文件直接由Nginx提供（比Flask快10-100倍）
# 3. Gzip压缩（减少传输体积）
# 4. 反向代理到Gunicorn/uWSGI

worker_processes auto;
error_log /var/log/nginx/doc_editor_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    
    access_log /var/log/nginx/doc_editor_access.log main;

    # 性能优化配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;  # 与应用配置一致

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;  # 平衡压缩比和CPU使用率
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss;

    # 上游服务器配置（Gunicorn或uWSGI）
    upstream doc_editor_app {
        # 使用Unix socket（比TCP更高效）
        server unix:/tmp/doc_editor.sock fail_timeout=0;
        # 或者使用TCP: server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name your-domain.com;  # 替换为实际域名

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 静态文件直接由Nginx提供（性能最佳）
        location /static/ {
            alias /path/to/doc_editor/static/;  # 替换为实际路径
            expires 30d;  # 静态文件缓存30天
            add_header Cache-Control "public, immutable";
            # 开启gzip静态压缩（如果有预压缩文件）
            # gzip_static on;
        }

        # 网站根路径和模板页面
        location / {
            # 先尝试静态文件，否则转发到应用
            try_files $uri @proxy_to_app;
        }

        # API请求转发到Flask应用
        location /api/ {
            proxy_pass http://doc_editor_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲区优化
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # 代理到应用服务器
        location @proxy_to_app {
            proxy_pass http://doc_editor_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # HTTPS服务器配置（推荐生产环境使用）
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     
    #     ssl_certificate /path/to/fullchain.pem;
    #     ssl_certificate_key /path/to/privkey.pem;
    #     
    #     # SSL优化
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     
    #     # 其余配置同HTTP服务器...
    # }

    # HTTP重定向到HTTPS（如果启用HTTPS）
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
