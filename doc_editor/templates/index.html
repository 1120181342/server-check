<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单文档编辑器</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 登录/注册页面 -->
        <div id="auth-page" class="page active">
            <div class="auth-container">
                <h1>简单文档编辑器</h1>
                <div class="auth-tabs">
                    <button id="login-tab" class="tab active">登录</button>
                    <button id="register-tab" class="tab">注册</button>
                </div>
                
                <!-- 登录表单 -->
                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn-primary">登录</button>
                </form>
                
                <!-- 注册表单 -->
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <input type="text" id="register-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">邮箱（可选）</label>
                        <input type="email" id="register-email" placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label for="register-realname">真实姓名（可选）</label>
                        <input type="text" id="register-realname" placeholder="请输入真实姓名">
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn-primary">注册</button>
                </form>
                
                <div id="auth-message" class="message"></div>
            </div>
        </div>
        
        <!-- 编辑器页面 -->
        <div id="editor-page" class="page">
            <div class="editor-container">
                <!-- 顶部工具栏 -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <span id="current-filename" class="filename">未命名.txt</span>
                    </div>
                    <div class="toolbar-right">
                        <button id="btn-new" class="btn-toolbar" title="新建">新建</button>
                        <button id="btn-open" class="btn-toolbar" title="打开">打开</button>
                        <button id="btn-save" class="btn-toolbar" title="保存">保存</button>
                        <button id="btn-saveas" class="btn-toolbar" title="另存为">另存为</button>
                        <div class="user-info">
                            <span id="user-name">用户</span>
                            <button id="btn-logout" class="btn-logout">退出</button>
                        </div>
                    </div>
                </div>
                
                <!-- 主内容区 -->
                <div class="main-content">
                    <!-- 文件列表侧边栏 -->
                    <div id="file-sidebar" class="file-sidebar hidden">
                        <div class="sidebar-header">
                            <h3>我的文件</h3>
                            <button id="btn-close-sidebar" class="btn-close">×</button>
                        </div>
                        <div id="file-list" class="file-list">
                            <!-- 文件列表项将通过JS动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 编辑器区域 -->
                    <div class="editor-area">
                        <textarea id="editor" class="editor-textarea" placeholder="开始输入文字..."></textarea>
                    </div>
                </div>
                
                <!-- 状态栏 -->
                <div class="statusbar">
                    <span id="status-message">就绪</span>
                    <span id="file-size">0 字节</span>
                </div>
            </div>
        </div>
        
        <!-- 模态框 -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">新建文件</h3>
                    <button id="btn-close-modal" class="btn-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label id="modal-label">文件名</label>
                        <input type="text" id="modal-input" placeholder="请输入文件名">
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="btn-modal-cancel" class="btn-secondary">取消</button>
                    <button id="btn-modal-confirm" class="btn-primary">确定</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
