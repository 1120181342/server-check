# 华为E8000防火墙文档爬虫配置文件

crawler:
  name: "Huawei E8000 Firewall Document Crawler"
  version: "1.0.0"
  
  request:
    timeout: 30
    max_retries: 3
    retry_delay: 2
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Accept-Encoding: "gzip, deflate, br"
      Connection: "keep-alive"
    
  concurrency:
    max_workers: 5
    rate_limit: 1.0
  
  storage:
    output_dir: "./downloads"
    save_html: true
    save_pdf: true
    create_index: true
  
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "./crawler.log"

target:
  base_url: "https://support.huawei.com"
  search_url: "https://support.huawei.com/enterprisesearch/"
  
  products:
    - name: "Eudemon 8000系列"
      keywords:
        - "Eudemon 8040"
        - "Eudemon 8080"
        - "Eudemon 8000"
        - "Quidway Eudemon 8040"
        - "Quidway Eudemon 8080"
    
    - name: "USG系列"
      keywords:
        - "USG6000"
        - "USG9000"
        - "USG5000"
  
  document_types:
    - "产品文档"
    - "配置指南"
    - "安装指南"
    - "操作维护"
    - "故障处理"
    - "版本文档"
    - "快速系列"

filter:
  allowed_domains:
    - "support.huawei.com"
    - "e.huawei.com"
  
  excluded_patterns:
    - ".*login.*"
    - ".*register.*"
    - ".*download\\?.*"
    - ".*javascript.*"
  
  url_patterns:
    - ".*product.*"
    - ".*document.*"
    - ".*support.*"
