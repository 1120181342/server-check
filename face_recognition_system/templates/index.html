<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司人脸识别系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>公司人脸识别系统</h1>
            <div class="tabs">
                <button class="tab-btn active" data-tab="recognize">人脸识别</button>
                <button class="tab-btn" data-tab="manage">员工管理</button>
                <button class="tab-btn" data-tab="logs">访问记录</button>
            </div>
        </header>

        <main>
            <!-- 人脸识别面板 -->
            <section id="recognize-tab" class="tab-content active">
                <div class="recognize-container">
                    <div class="video-container">
                        <video id="video" autoplay muted></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                        <div id="overlay" class="overlay">
                            <div id="overlay-content"></div>
                        </div>
                    </div>
                    <div class="controls">
                        <button id="startBtn" class="btn btn-primary">开始识别</button>
                        <button id="stopBtn" class="btn btn-secondary" style="display: none;">停止识别</button>
                    </div>
                    <div id="status" class="status"></div>
                </div>
            </section>

            <!-- 员工管理面板 -->
            <section id="manage-tab" class="tab-content">
                <div class="manage-container">
                    <div class="add-employee-section">
                        <h2>添加新员工</h2>
                        <form id="employeeForm" class="employee-form">
                            <div class="form-group">
                                <label for="employeeId">员工编号 *</label>
                                <input type="text" id="employeeId" name="employeeId" required>
                            </div>
                            <div class="form-group">
                                <label for="employeeName">姓名 *</label>
                                <input type="text" id="employeeName" name="employeeName" required>
                            </div>
                            <div class="form-group">
                                <label for="department">部门 *</label>
                                <input type="text" id="department" name="department" required>
                            </div>
                            <div class="form-group">
                                <label for="email">邮箱</label>
                                <input type="email" id="email" name="email">
                            </div>
                            <div class="form-group">
                                <label for="phone">电话</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                            <div class="form-group">
                                <label for="faceImage">人脸照片 *</label>
                                <input type="file" id="faceImage" name="faceImage" accept="image/*" required>
                                <div class="image-preview" id="imagePreview" style="display: none;">
                                    <img id="previewImg" alt="预览">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">添加员工</button>
                        </form>
                    </div>

                    <div class="employee-list-section">
                        <h2>员工列表</h2>
                        <div class="search-bar">
                            <input type="text" id="searchEmployee" placeholder="搜索员工...">
                        </div>
                        <div class="employee-list" id="employeeList">
                            <p class="loading">加载中...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 访问记录面板 -->
            <section id="logs-tab" class="tab-content">
                <div class="logs-container">
                    <div class="logs-header">
                        <h2>访问记录</h2>
                        <button id="refreshLogs" class="btn btn-secondary">刷新</button>
                    </div>
                    <div class="logs-table-container">
                        <table class="logs-table">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>员工编号</th>
                                    <th>姓名</th>
                                    <th>状态</th>
                                    <th>置信度</th>
                                    <th>备注</th>
                                </tr>
                            </thead>
                            <tbody id="logsBody">
                                <tr>
                                    <td colspan="6" class="loading">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 公司人脸识别系统 | 高性能 · 高安全 · 高可靠</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
