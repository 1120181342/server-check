<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐厅订餐管理系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="top-nav">
            <h1 class="app-title">美味餐厅</h1>
            <div class="cart-icon" onclick="showCart()">
                <span class="cart-count">0</span>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 选餐页面 -->
            <section id="menu" class="page active">
                <div class="page-header">
                    <h2>美食菜单</h2>
                    <span class="subtitle">共30道精选菜品</span>
                </div>
                
                <div class="category-tabs">
                    <button class="category-tab active" onclick="filterCategory('all')">全部</button>
                    <button class="category-tab" onclick="filterCategory('hot')">热菜</button>
                    <button class="category-tab" onclick="filterCategory('cold')">凉菜</button>
                    <button class="category-tab" onclick="filterCategory('drink')">饮品</button>
                    <button class="category-tab" onclick="filterCategory('dessert')">甜点</button>
                </div>
                
                <div class="menu-list" id="menuList">
                    <!-- 菜品卡片将通过JavaScript动态生成 -->
                </div>
                
                <div class="bottom-bar">
                    <div class="cart-summary" onclick="showCart()">
                        <span class="cart-icon-big">
                            <span class="cart-count-big">0</span>
                        </span>
                        <div class="cart-info">
                            <span class="cart-total">¥0.00</span>
                            <span class="cart-count-text">共0件商品</span>
                        </div>
                    </div>
                    <button class="confirm-btn" onclick="goToBooking()">去预订</button>
                </div>
            </section>

            <!-- 预订页面 -->
            <section id="booking" class="page">
                <div class="page-header">
                    <h2>预订确认</h2>
                    <button class="back-btn" onclick="switchPage('menu')">← 返回</button>
                </div>
                
                <div class="booking-container">
                    <div class="booking-header">
                        <h3>已选菜品</h3>
                    </div>
                    
                    <div class="selected-items" id="selectedItems">
                        <!-- 已选菜品将通过JavaScript动态生成 -->
                    </div>
                    
                    <div class="booking-summary">
                        <div class="summary-row">
                            <span>菜品数量</span>
                            <span id="totalQuantity">0 件</span>
                        </div>
                        <div class="summary-row total">
                            <span>订单总额</span>
                            <span id="bookingTotal">¥0.00</span>
                        </div>
                    </div>
                    
                    <button class="booking-btn" onclick="goToPayment()">确认预订</button>
                </div>
            </section>

            <!-- 付款页面 -->
            <section id="payment" class="page">
                <div class="page-header">
                    <h2>订单支付</h2>
                    <button class="back-btn" onclick="switchPage('booking')">← 返回</button>
                </div>
                
                <div class="payment-container">
                    <div class="order-summary-card">
                        <div class="summary-header">
                            <h3>订单信息</h3>
                            <span class="order-number">订单号: <span id="orderNumber">ORD202405010001</span></span>
                        </div>
                        
                        <div class="order-items" id="paymentOrderItems">
                            <!-- 订单菜品将通过JavaScript动态生成 -->
                        </div>
                        
                        <div class="order-total">
                            <span>应付金额</span>
                            <span class="amount">¥0.00</span>
                        </div>
                    </div>
                    
                    <div class="payment-methods">
                        <h3>选择支付方式</h3>
                        
                        <div class="payment-method active" onclick="selectPayment(this)">
                            <div class="payment-icon">💳</div>
                            <div class="payment-info">
                                <h4>微信支付</h4>
                                <p>推荐使用，支付便捷</p>
                            </div>
                            <div class="payment-radio">
                                <span class="radio-circle checked"></span>
                            </div>
                        </div>
                        
                        <div class="payment-method" onclick="selectPayment(this)">
                            <div class="payment-icon">💰</div>
                            <div class="payment-info">
                                <h4>支付宝</h4>
                                <p>安全可靠，安全支付</p>
                            </div>
                            <div class="payment-radio">
                                <span class="radio-circle"></span>
                            </div>
                        </div>
                        
                        <div class="payment-method" onclick="selectPayment(this)">
                            <div class="payment-icon">🏦</div>
                            <div class="payment-info">
                                <h4>银行卡支付</h4>
                                <p>支持各大银行储蓄卡、信用卡</p>
                            </div>
                            <div class="payment-radio">
                                <span class="radio-circle"></span>
                            </div>
                        </div>
                    </div>
                    
                    <button class="pay-btn" onclick="completePayment()">立即支付</button>
                </div>
            </section>

            <!-- 售后页面 -->
            <section id="aftersale" class="page">
                <div class="page-header">
                    <h2>订单完成</h2>
                </div>
                
                <div class="aftersale-container">
                    <div class="success-icon">
                        <div class="checkmark">✓</div>
                    </div>
                    
                    <div class="success-message">
                        <h2>支付成功！</h2>
                        <p>您的订单已确认</p>
                    </div>
                    
                    <div class="order-info-card">
                        <div class="info-row">
                            <span class="info-label">订单号</span>
                            <span class="info-value" id="aftersaleOrderNumber">ORD202405010001</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">支付金额</span>
                            <span class="info-value" id="aftersaleAmount">¥0.00</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">支付方式</span>
                            <span class="info-value" id="aftersalePaymentMethod">微信支付</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">下单时间</span>
                            <span class="info-value" id="aftersaleTime">2024-05-01 12:00</span>
                        </div>
                    </div>
                    
                    <div class="delivery-form">
                        <h3>配送信息</h3>
                        
                        <div class="form-group">
                            <label for="customerName">姓名</label>
                            <input type="text" id="customerName" placeholder="请输入您的姓名">
                        </div>
                        
                        <div class="form-group">
                            <label for="customerPhone">联系电话</label>
                            <input type="tel" id="customerPhone" placeholder="请输入您的联系电话">
                        </div>
                        
                        <div class="form-group">
                            <label for="customerAddress">配送地址</label>
                            <textarea id="customerAddress" placeholder="请输入详细的配送地址"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="deliveryTime">配送时间</label>
                            <select id="deliveryTime">
                                <option value="now">立即配送</option>
                                <option value="12:00">今天 12:00-13:00</option>
                                <option value="18:00">今天 18:00-19:00</option>
                                <option value="tomorrow">明天 12:00-13:00</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="remarks">备注</label>
                            <textarea id="remarks" placeholder="如有特殊要求，请在此备注"></textarea>
                        </div>
                    </div>
                    
                    <button class="submit-info-btn" onclick="submitDeliveryInfo()">提交配送信息</button>
                    
                    <button class="continue-btn" onclick="continueShopping()">继续点餐</button>
                </div>
            </section>
        </main>
    </div>

    <!-- 购物车弹窗 -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>购物车</h3>
                <button class="close-btn" onclick="closeCart()">×</button>
            </div>
            
            <div class="cart-items" id="cartItems">
                <!-- 购物车内容将通过JavaScript动态生成 -->
            </div>
            
            <div class="cart-footer">
                <div class="cart-total-info">
                    <span>合计：</span>
                    <span class="modal-total">¥0.00</span>
                </div>
                <button class="modal-confirm-btn" onclick="goToBooking()">去预订</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
